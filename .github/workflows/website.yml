name: Website
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.selection.outputs.changed }}
      snapshot: ${{ steps.selection.outputs.snapshot }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - id: selection
        name: Freeze release selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            node --experimental-strip-types tools/select-release.ts --poll
          else
            node --experimental-strip-types tools/select-release.ts --deployed
          fi
      - if: steps.selection.outputs.changed == 'true'
        run: npm ci
      - if: steps.selection.outputs.changed == 'true'
        run: npm run format:check
      - if: steps.selection.outputs.changed == 'true'
        run: npm run release:import -- --snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.selection.outputs.changed == 'true'
        run: npm run check
      - if: steps.selection.outputs.changed == 'true'
        run: npm test
      - if: steps.selection.outputs.changed == 'true'
        run: npm run build
      - if: steps.selection.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: steps.selection.outputs.changed == 'true'
        run: npm run test:browser
      - if: steps.selection.outputs.changed == 'true'
        run: npm run test:browser:built
      - if: steps.selection.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.outputs.changed == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - id: freshness
        name: Reject superseded deployment
        env:
          RELEASE_SNAPSHOT: ${{ needs.validate.outputs.snapshot }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types tools/select-release.ts --freshness
      - if: steps.freshness.outputs.fresh == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
