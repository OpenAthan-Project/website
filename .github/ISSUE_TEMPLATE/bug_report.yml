name: Bug report
description: Report a reproducible website, documentation, or installer problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Homepage or public documentation
        - Hardware/build guidance
        - Browser installer
        - Other project infrastructure
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or route
      placeholder: https://openathan.com/install
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      description: Include versions when known.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
